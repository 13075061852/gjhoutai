# Included inside the kingpolymer.com / www.kingpolymer.com HTTPS server block.
# Serves the gjhoutai admin platform under /gjhoutai/ and leaves every other
# location (including the existing /web/ website and the root proxy) untouched.
location = /gjhoutai {
    return 308 /gjhoutai/;
}

location ^~ /gjhoutai/ {
    client_max_body_size 120m;

    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    proxy_buffering off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'" always;
}
