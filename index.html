<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var root = document.documentElement;
        root.dataset.assistantCollapsed = localStorage.getItem('assistant-collapsed') === '1' ? '1' : '0';
      } catch (error) {
        // Ignore storage access failures and fall back to the default expanded state.
      }
    })();
  </script>
  <title>塑料粒子测试分析平台</title>
  <link rel="icon" type="image/png" href="./logo.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div class="app">
    <div class="shell" id="shell">
            <aside class="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-badge"><img src="./logo.png" alt="广俊新材料 Logo"></div>
            <div class="brand-title">广俊塑料科技</div>
          </div>
        </div>

        <div class="sidebar-scroll">
          <div class="sidebar-section">
            <div class="sidebar-search">
              <i class="ti ti-search" aria-hidden="true"></i>
              <input type="text" placeholder="快速搜索..." aria-label="快速搜索" />
              <span class="search-kbd">Ctrl K</span>
            </div>
          </div>

          <div class="sidebar-section">
            <button class="nav-item" type="button" data-page="dashboard">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-home" aria-hidden="true"></i></span>
                <span class="nav-text">仪表盘</span>
              </span>
            </button>
            <button class="nav-item" type="button" id="aiConfigNav" data-page="ai-config">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-bolt" aria-hidden="true"></i></span>
                <span class="nav-text">AI配置</span>
              </span>
            </button>
          </div>

          <div class="sidebar-section">
            <div class="section-label">业务中心</div>
            <div class="nav-group expanded">
              <button class="nav-item nav-parent" type="button" data-toggle="group" aria-expanded="true">
                <span class="nav-main">
                  <span class="nav-icon"><i class="ti ti-shopping-cart" aria-hidden="true"></i></span>
                  <span class="nav-text">销售与订单</span>
                </span>
                <span class="nav-arrow">›</span>
              </button>
              <div class="nav-children">
                <button class="nav-subitem" type="button" data-page="order-management">订单管理</button>
                <button class="nav-subitem" type="button" data-page="invoice-print">开单打印</button>
                <button class="nav-subitem" type="button" data-page="sales-stock">销售库存</button>
              </div>
            </div>
            <div class="nav-group">
              <button class="nav-item nav-parent" type="button" data-toggle="group" aria-expanded="false">
                <span class="nav-main">
                  <span class="nav-icon"><i class="ti ti-globe" aria-hidden="true"></i></span>
                  <span class="nav-text">生产与配方</span>
                </span>
                <span class="nav-arrow">›</span>
              </button>
              <div class="nav-children">
                <button class="nav-subitem" type="button" data-page="formula-management">配方管理</button>
                <button class="nav-subitem" type="button" data-page="production-plan">生产计划</button>
              </div>
            </div>
          </div>

          <div class="sidebar-section">
            <div class="section-label">基础数据</div>
            <button class="nav-item" type="button" data-page="supplier-archive">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-package" aria-hidden="true"></i></span>
                <span class="nav-text">供应商档案</span>
              </span>
            </button>
            <button class="nav-item" type="button" data-page="customer-archive">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-user" aria-hidden="true"></i></span>
                <span class="nav-text">客户档案</span>
              </span>
            </button>
            <button class="nav-item" type="button" data-page="personnel-archive">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-users" aria-hidden="true"></i></span>
                <span class="nav-text">人员档案</span>
              </span>
            </button>
            <button class="nav-item" type="button" data-page="data-source-config">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-database" aria-hidden="true"></i></span>
                <span class="nav-text">数据源配置</span>
              </span>
            </button>
          </div>

          <div class="sidebar-section">
            <div class="section-label">系统管理</div>
            <button class="nav-item" type="button" data-page="permission-management">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-shield-check" aria-hidden="true"></i></span>
                <span class="nav-text">权限管理</span>
              </span>
            </button>
            <button class="nav-item" type="button" data-page="audit-log">
              <span class="nav-main">
                <span class="nav-icon"><i class="ti ti-history" aria-hidden="true"></i></span>
                <span class="nav-text">审计日志</span>
              </span>
            </button>
          </div>
        </div>

        <div class="sidebar-footer">
          <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-expanded="true" aria-label="收起侧边栏">
            <span class="toggle-icon">
              <i class="ti ti-chevron-left" aria-hidden="true"></i>
            </span>
            <span class="sidebar-toggle-label">收起侧边栏</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="top-actions">
            <button class="pill-btn primary" id="askAiToggle" type="button" aria-expanded="true" aria-label="收起 Gjun AI"><span>✦</span><strong>Gjun AI</strong></button>
            <button class="icon-btn" type="button" aria-label="账户">
              <i class="ti ti-user" aria-hidden="true"></i>
            </button>
          </div>
        </header>

        <div class="content">
          <section class="dashboard ai-config page-section active" data-page-section="ai-config">
            <div class="hero config-hero">
              <div class="config-hero-left">
                <div class="config-hero-icon" aria-hidden="true">AI</div>
                <div class="config-hero-copy">
                <h1>AI 配置中心</h1>
                <p>配置 AI 模型与参数，开启智能分析之旅</p>
                </div>
              </div>
              <div class="hero-actions">
                <span class="status-pill success" id="configStatus">本地配置：未保存</span>
              </div>
            </div>

            <div class="config-layout">
              <div class="config-column">
                <article class="panel config-card">
                  <div class="panel-head panel-head-hero">
                    <div class="panel-head-left">
                      <span class="panel-title">OpenRouter 接入配置</span>
                      <a class="panel-help" href="https://openrouter.ai/docs/api/api-reference/models/get-models" target="_blank" rel="noreferrer">如何获取 API 密钥?</a>
                    </div>
                  </div>
                  <form class="config-form" id="aiConfigForm">
                    <div class="form-grid">
                      <div class="field full">
                        <label class="field-label-row" for="openrouterApiKey">
                          <span class="field-label-main">
                            <i class="field-label-icon ti ti-lock" aria-hidden="true"></i>
                            <span>OpenRouter API 密钥</span>
                          </span>
                          <span class="field-label-note">私密存储，安全加密</span>
                        </label>
                        <div class="password-row">
                          <input id="openrouterApiKey" name="openrouterApiKey" type="password" placeholder="sk-or-..." autocomplete="off" />
                          <button class="password-toggle" id="apiKeyToggle" type="button" aria-label="显示或隐藏 API 密钥">
                            <i class="password-toggle-icon ti ti-eye" aria-hidden="true"></i>
                          </button>
                        </div>
                      </div>
                      <div class="form-grid form-grid-3">
                        <div class="field">
                          <label for="openrouterBaseUrl">
                            <span class="field-label-main">
                              <i class="field-label-icon ti ti-world" aria-hidden="true"></i>
                              <span>API 基地址</span>
                            </span>
                          </label>
                          <input id="openrouterBaseUrl" name="openrouterBaseUrl" type="url" value="https://openrouter.ai/api/v1" />
                          <small>OpenRouter API 的基础访问地址。</small>
                        </div>
                        <div class="field">
                          <label for="modelSelectTrigger">
                            <span class="field-label-main">
                              <i class="field-label-icon ti ti-cpu-2" aria-hidden="true"></i>
                              <span>默认模型</span>
                            </span>
                          </label>
                          <div class="model-dropdown" id="modelDropdown">
                            <button class="model-dropdown-trigger" id="modelSelectTrigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="modelSelectPanel">
                              <span class="model-dropdown-value" id="modelSelectTriggerLabel">openai/gpt-4o-mini</span>
                              <span class="model-dropdown-arrow" aria-hidden="true">▾</span>
                            </button>
                            <div class="model-dropdown-panel" id="modelSelectPanel" role="listbox" aria-label="模型选择列表"></div>
                            <select id="modelSelect" name="modelSelect" hidden>
                            <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
                            <option value="anthropic/claude-3.5-sonnet">anthropic/claude-3.5-sonnet</option>
                            <option value="google/gemini-2.5-flash">google/gemini-2.5-flash</option>
                            <option value="deepseek/deepseek-chat">deepseek/deepseek-chat</option>
                            </select>
                          </div>
                          <small>选择默认使用的 AI 模型。</small>
                        </div>
                        <div class="field">
                          <label for="appTitle">
                            <span class="field-label-main">
                              <i class="field-label-icon ti ti-share" aria-hidden="true"></i>
                              <span>模型提供商</span>
                            </span>
                          </label>
                          <input id="appTitle" name="appTitle" type="text" value="OpenRouter" readonly />
                          <small>当前接入的模型提供商。</small>
                        </div>
                      </div>
                      <div class="field full hidden-field">
                        <label for="httpReferer">HTTP-Referer <span>可选</span></label>
                        <input id="httpReferer" name="httpReferer" type="url" placeholder="https://example.com" />
                      </div>
                      <div class="field full">
                        <div class="field-header-row">
                          <label class="field-label-row" for="systemPrompt">
                            <span class="field-label-main">
                              <i class="field-label-icon ti ti-file-text" aria-hidden="true"></i>
                              <span>系统提示词（可选）</span>
                            </span>
                          </label>
                        </div>
                        <textarea id="systemPrompt" name="systemPrompt" placeholder="你是一个专业、简洁的企业 AI 助手。">你是一个专业、简洁的企业 AI 助手，输出要准确、结构清晰，并优先给出可执行建议。</textarea>
                      </div>
                      <div class="field full temperature-field">
                        <label class="field-label-row" for="temperature">
                          <span class="field-label-main">
                            <i class="field-label-icon ti ti-thermometer" aria-hidden="true"></i>
                            <span>Temperature（创造性）</span>
                          </span>
                        </label>
                        <div class="slider-row">
                          <input id="temperature" name="temperature" type="range" min="0" max="2" step="0.1" value="0.7" />
                          <span class="slider-value" id="temperatureValue">0.7</span>
                          <span class="slider-badge">推荐 0.7</span>
                        </div>
                      </div>
                      <div class="field hidden-field">
                        <label for="maxTokens">Max Tokens <span>输出长度</span></label>
                        <input id="maxTokens" name="maxTokens" type="number" min="64" step="64" value="1024" />
                      </div>
                      <div class="field full hidden-field">
                        <label>调用选项 <span>可同时开启</span></label>
                        <div class="switches">
                          <label class="switch"><input id="streamEnabled" name="streamEnabled" type="checkbox" checked />流式输出</label>
                          <label class="switch"><input id="jsonMode" name="jsonMode" type="checkbox" />启用 JSON 输出</label>
                          <label class="switch"><input id="logEnabled" name="logEnabled" type="checkbox" checked />保存本地调用日志</label>
                        </div>
                      </div>
                    </div>

                    <div class="action-bar">
                      <div class="action-buttons">
                        <button class="save-btn" type="submit">
                          <i class="ti ti-device-floppy" aria-hidden="true"></i>
                          <span>保存配置</span>
                        </button>
                        <button class="ghost-btn outline-btn" type="button" id="testConfigBtn">
                          <i class="ti ti-refresh" aria-hidden="true"></i>
                          <span>检测配置</span>
                        </button>
                      </div>
                      <div class="action-note success-note">配置已加密存储，仅保存在本地，不会上传任何数据</div>
                    </div>
                  </form>
                </article>
              </div>
            </div>

            <input id="configFileInput" type="file" accept="application/json,.json" hidden />
            <div class="bottom-space"></div>
          </section>

          <section class="dashboard page-section" data-page-section="placeholder">
            <div class="placeholder-page">
              <div class="placeholder-card">
                <span class="placeholder-eyebrow" id="placeholderEyebrow">功能开发中</span>
                <h2 class="placeholder-title" id="placeholderTitle">请选择左侧功能</h2>
                <p class="placeholder-desc" id="placeholderDesc">点击一个导航项后，这里会展示对应页面。当前只有 AI 配置中心是完整可用的，其它模块先以占位页提示“功能开发中”。</p>
                <div class="placeholder-actions">
                  <button class="ghost-btn" type="button" id="placeholderBackBtn">返回 AI 配置</button>
                  <button class="accent-btn" type="button" id="placeholderOpenBtn">继续浏览</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>

      <aside class="assistant">
        <div class="assistant-head">
          <div class="assistant-convo-wrap" id="conversationMenuWrap">
            <button class="assistant-convo-btn" type="button" id="conversationMenuBtn" aria-haspopup="menu" aria-expanded="false" aria-label="历史对话">
              <span class="assistant-convo-label" id="conversationMenuLabel">新建对话</span>
              <span class="assistant-convo-caret" aria-hidden="true">
                <i class="ti ti-chevron-down" aria-hidden="true"></i>
              </span>
            </button>
            <div class="assistant-convo-menu" id="conversationMenuPanel" role="menu" aria-label="历史对话" hidden></div>
          </div>
          <div class="assistant-head-actions">
            <button class="icon-btn assistant-icon-btn" type="button" id="assistantNewBtn" aria-label="新建窗口">
              <i class="ti ti-plus" aria-hidden="true"></i>
            </button>
            <button class="icon-btn assistant-icon-btn" type="button" id="assistantExpandBtn" aria-label="展开聊天区">
              <i class="ti ti-maximize" aria-hidden="true"></i>
            </button>
            <button class="icon-btn assistant-icon-btn" type="button" id="assistantCloseBtn" aria-label="收起聊天区">
              <i class="ti ti-x" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="assistant-body">
          <div id="chatMessages" class="ai-box ai-box-scroll">
          </div>
        </div>
        <div class="assistant-footer">
          <textarea class="chat-input" id="chatInput" placeholder="输入问题，按 Enter 分析，Shift+Enter 换行"></textarea>
          <div class="footer-actions">
            <div class="footer-actions-left">
              <button class="tiny-btn" type="button" id="clearChatBtn">清空聊天</button>
              <button class="tiny-btn" type="button" id="copyConfigBtn">复制配置</button>
            </div>
            <button class="send-btn" type="button" id="chatSendBtn">开始分析</button>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <script src="./assets/js/app-state.js"></script>
  <script src="./assets/js/navigation.js"></script>
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/chat.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
