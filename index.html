  <script>
    (function () {
      try {
        var root = document.documentElement;
        root.dataset.sidebarCollapsed = localStorage.getItem('sidebar-collapsed') === '1' ? '1' : '0';
        root.dataset.assistantCollapsed = localStorage.getItem('assistant-collapsed') === '1' ? '1' : '0';
        root.dataset.colorMode = localStorage.getItem('gjh-theme-mode-v1') || 'light';
        var savedThemeVars = JSON.parse(localStorage.getItem('gjh-theme-vars-v1') || 'null');
        if (savedThemeVars && typeof savedThemeVars === 'object') {
          Object.keys(savedThemeVars).forEach(function (key) {
            root.style.setProperty(key, savedThemeVars[key]);
          });
        }
        try {
          var savedFontVars = JSON.parse(localStorage.getItem('gjh-font-vars-v1') || 'null');
          if (savedFontVars && savedFontVars.family) {
            root.style.setProperty('--app-font-family', savedFontVars.family);
            root.dataset.fontPreset = savedFontVars.id || 'system';
          }
        } catch (fontError) {}
        root.dataset.colorTheme = localStorage.getItem('gjh-theme-id-v1') || 'white';
      } catch (error) {
        // Ignore storage access failures and fall back to the default expanded state.
      }
    })();
  </script>
